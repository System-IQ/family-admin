// ============================================================
//  Family Admin v3.0 — ULTRA Root Build Configuration
//  Author: Family Tracker Team
//  Date: 2026
// ============================================================
buildscript {
    ext {
        // ═══════════════════════════════════════════════════════
        //  🎯 SDK VERSIONS
        // ═══════════════════════════════════════════════════════
        compileSdkVersion = 34
        targetSdkVersion = 34
        minSdkVersion = 24
        buildToolsVersion = "34.0.0"
        ndkVersion = "25.2.9519653"

        // ═══════════════════════════════════════════════════════
        //  ⚙️ BUILD TOOLS
        // ═══════════════════════════════════════════════════════
        agpVersion = "8.2.2"
        kotlinVersion = "1.9.22"
        kspVersion = "1.9.22-1.0.17"
        gradleVersion = "8.4"

        // ═══════════════════════════════════════════════════════
        //  🐍 CHAQUOPY (Python Runtime)
        // ═══════════════════════════════════════════════════════
        chaquopyVersion = "15.0.1"
        pythonVersion = "3.11"

        // ═══════════════════════════════════════════════════════
        //  🎨 ANDROIDX CORE
        // ═══════════════════════════════════════════════════════
        coreKtxVersion = "1.12.0"
        appcompatVersion = "1.6.1"
        activityVersion = "1.8.2"
        fragmentVersion = "1.6.2"
        lifecycleVersion = "2.7.0"
        navigationVersion = "2.7.7"
        constraintLayoutVersion = "2.1.4"
        recyclerViewVersion = "1.3.2"
        cardViewVersion = "1.0.0"
        viewPager2Version = "1.0.0"
        swipeRefreshVersion = "1.1.0"
        preferenceVersion = "1.2.1"
        workManagerVersion = "2.9.0"
        roomVersion = "2.6.1"
        pagingVersion = "3.2.1"
        splashScreenVersion = "1.0.1"
        windowVersion = "1.2.0"
        paletteVersion = "1.0.0"
        dynamicAnimationVersion = "1.0.0"

        // ═══════════════════════════════════════════════════════
        //  🎨 MATERIAL DESIGN 3
        // ═══════════════════════════════════════════════════════
        materialVersion = "1.11.0"
        materialDialogsVersion = "3.5.0"
        materialChipsVersion = "1.5.0"

        // ═══════════════════════════════════════════════════════
        //  🔥 FIREBASE
        // ═══════════════════════════════════════════════════════
        firebaseBomVersion = "32.7.4"
        googleServicesVersion = "4.4.1"

        // ═══════════════════════════════════════════════════════
        //  🗺️ GOOGLE PLAY SERVICES
        // ═══════════════════════════════════════════════════════
        playServicesMapsVersion = "18.2.0"
        playServicesLocationVersion = "21.1.0"
        playServicesAuthVersion = "20.7.0"
        playServicesBaseVersion = "18.2.0"

        // ═══════════════════════════════════════════════════════
        //  🌐 NETWORKING
        // ═══════════════════════════════════════════════════════
        okhttpVersion = "4.12.0"
        retrofitVersion = "2.9.0"
        gsonVersion = "2.10.1"
        moshiVersion = "1.15.0"
        kotlinSerializationVersion = "1.6.2"

        // ═══════════════════════════════════════════════════════
        //  🎨 IMAGES & MEDIA
        // ═══════════════════════════════════════════════════════
        glideVersion = "4.16.0"
        coilVersion = "2.5.0"
        lottieVersion = "6.3.0"
        photoViewVersion = "2.3.0"

        // ═══════════════════════════════════════════════════════
        //  📊 CHARTS & VISUALIZATION
        // ═══════════════════════════════════════════════════════
        mpAndroidChartVersion = "v3.1.0"
        sparklineVersion = "1.0.0"

        // ═══════════════════════════════════════════════════════
        //  🔐 SECURITY
        // ═══════════════════════════════════════════════════════
        securityCryptoVersion = "1.1.0-alpha06"
        biometricVersion = "1.1.0"
        sqlCipherVersion = "4.5.4"

        // ═══════════════════════════════════════════════════════
        //  🛠️ UTILITIES
        // ═══════════════════════════════════════════════════════
        coroutinesVersion = "1.7.3"
        timberVersion = "5.0.1"
        permissionDispatcherVersion = "4.9.2"
        easyPermissionsVersion = "3.0.0"
        dateTimeVersion = "0.4.3"
        progressViewVersion = "1.7"
        circleImageViewVersion = "3.1.0"
        shimmerVersion = "0.5.0"

        // ═══════════════════════════════════════════════════════
        //  🎭 UI ENHANCEMENTS
        // ═══════════════════════════════════════════════════════
        expandableLayoutVersion = "1.0.4"
        skeletonLayoutVersion = "1.0.0"
        fancyToastVersion = "0.1.9"
        animatedBottomBarVersion = "1.0.9"

        // ═══════════════════════════════════════════════════════
        //  🧪 TESTING
        // ═══════════════════════════════════════════════════════
        junitVersion = "4.13.2"
        mockitoVersion = "5.7.0"
        mockkVersion = "1.13.8"
        espressoVersion = "3.5.1"
        androidxTestVersion = "1.5.0"

        // ═══════════════════════════════════════════════════════
        //  🚀 DEBUG TOOLS
        // ═══════════════════════════════════════════════════════
        leakCanaryVersion = "2.13"
        chuckerVersion = "4.0.0"
        strictModeVersion = "1.0.0"
    }

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }

    dependencies {
        classpath "com.android.tools.build:gradle:$agpVersion"
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion"
        classpath "com.chaquo.python:gradle:$chaquopyVersion"
        classpath "com.google.gms:google-services:$googleServicesVersion"
    }
}

// ============================================================
//  Global Configuration
// ============================================================
allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url 'https://jitpack.io' }
        maven { url 'https://chaquo.com/maven' }
    }

    // ═══ Compile Options ═══
    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.compilerArgs << "-Xlint:unchecked" << "-Xlint:deprecation"
    }

    // ═══ Kotlin Options ═══
    tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
        kotlinOptions {
            jvmTarget = "17"
            freeCompilerArgs += [
                "-opt-in=kotlin.RequiresOptIn",
                "-opt-in=kotlinx.coroutines.ExperimentalCoroutinesApi",
                "-opt-in=kotlinx.coroutines.FlowPreview",
            ]
        }
    }
}

// ============================================================
//  Clean Task
// ============================================================
tasks.register('clean', Delete) {
    delete rootProject.buildDir
}

