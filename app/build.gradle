// ============================================================
//  Family Admin v3.0 — App Module Build Configuration
//  Tested & Verified Configuration
//  Version: 3.0.0
// ============================================================

plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.chaquo.python'
    id 'com.google.gms.google-services'
}

// ═══════════════════════════════════════════════════════════
//  🎯 ANDROID CONFIGURATION
// ═══════════════════════════════════════════════════════════
android {
    namespace 'com.family.admin'
    compileSdk 34

    // ═══ NDK (مطلوب لـ Chaquopy) ═══
    ndkVersion "25.2.9519653"

    defaultConfig {
        applicationId "com.family.admin"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "3.0.0"

        // ═══ Multi-Dex (ضروري للـ 64K methods) ═══
        multiDexEnabled true

        // ═══ Vector Drawables ═══
        vectorDrawables {
            useSupportLibrary true
        }

        // ═══ Chaquopy — ABIs ═══
        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a"
        }
    }

    // ═══ Build Types ═══
    buildTypes {
        debug {
            debuggable true
            minifyEnabled false
            applicationIdSuffix ""
            versionNameSuffix "-debug"
        }

        release {
            debuggable false
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                          'proguard-rules.pro'
            signingConfig signingConfigs.debug
        }
    }

    // ═══ Signing Configs ═══
    signingConfigs {
        debug {
            storeFile file("${System.getProperty('user.home')}/.android/debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }

    // ═══ Compile Options ═══
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = '17'
        freeCompilerArgs += [
            "-opt-in=kotlin.RequiresOptIn"
        ]
    }

    // ═══ Build Features ═══
    buildFeatures {
        viewBinding true
        buildConfig true
    }

    // ═══ Packaging ═══
    packaging {
        resources {
            excludes += [
                'META-INF/DEPENDENCIES',
                'META-INF/LICENSE',
                'META-INF/LICENSE.txt',
                'META-INF/license.txt',
                'META-INF/NOTICE',
                'META-INF/NOTICE.txt',
                'META-INF/notice.txt',
                'META-INF/ASL2.0',
                'META-INF/*.kotlin_module',
                'META-INF/*.version',
                'META-INF/services/javax.annotation.processing.Processor',
                'META-INF/INDEX.LIST',
                'META-INF/io.netty.versions.properties'
            ]
        }
    }

    // ═══ Lint ═══
    lint {
        abortOnError false
        checkReleaseBuilds false
        disable 'MissingTranslation', 'ExtraTranslation'
    }
}

// ═══════════════════════════════════════════════════════════
//  🐍 CHAQUOPY — PYTHON CONFIGURATION
//  (التكوين الكامل — سيُفعّل عند إضافة ملفات Python)
// ═══════════════════════════════════════════════════════════
chaquopy {
    defaultConfig {
        version = "3.11"
        buildPython("python3")
        pip {
            // ═══ مكتبات Python الأساسية ═══
            install "flask"
            install "pyTelegramBotAPI"
            install "requests"
            install "python-dateutil"
            install "pytz"
            
            // ⚠️ firebase-admin محذوف — سنستخدم FCM عبر Kotlin
        }
    }
    productFlavors {
    }
    sourceSets {
        main {
            srcDir "src/main/python"
        }
    }
}

// ═══════════════════════════════════════════════════════════
//  📦 DEPENDENCIES — Core Libraries (Tested)
// ═══════════════════════════════════════════════════════════
dependencies {

    // ═══════════════════════════════════════════════════════════
    //  🎨 ANDROIDX CORE
    // ═══════════════════════════════════════════════════════════
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.activity:activity-ktx:1.8.2'
    implementation 'androidx.fragment:fragment-ktx:1.6.2'

    // ═══════════════════════════════════════════════════════════
    //  🎨 MATERIAL DESIGN 3
    // ═══════════════════════════════════════════════════════════
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.viewpager2:viewpager2:1.0.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'

    // ═══════════════════════════════════════════════════════════
    //  🧭 NAVIGATION
    // ═══════════════════════════════════════════════════════════
    implementation 'androidx.navigation:navigation-fragment-ktx:2.7.7'
    implementation 'androidx.navigation:navigation-ui-ktx:2.7.7'

    // ═══════════════════════════════════════════════════════════
    //  🔄 LIFECYCLE
    // ═══════════════════════════════════════════════════════════
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-service:2.7.0'

    // ═══════════════════════════════════════════════════════════
    //  ⚙️ PREFERENCE
    // ═══════════════════════════════════════════════════════════
    implementation 'androidx.preference:preference-ktx:1.2.1'

    // ═══════════════════════════════════════════════════════════
    //  🎬 SPLASH SCREEN
    // ═══════════════════════════════════════════════════════════
    implementation 'androidx.core:core-splashscreen:1.0.1'

    // ═══════════════════════════════════════════════════════════
    //  🔥 FIREBASE
    // ═══════════════════════════════════════════════════════════
    implementation platform('com.google.firebase:firebase-bom:32.7.4')
    implementation 'com.google.firebase:firebase-messaging-ktx'
    implementation 'com.google.firebase:firebase-firestore-ktx'

    // ═══════════════════════════════════════════════════════════
    //  🗺️ GOOGLE PLAY SERVICES
    // ═══════════════════════════════════════════════════════════
    implementation 'com.google.android.gms:play-services-maps:18.2.0'
    implementation 'com.google.android.gms:play-services-location:21.1.0'

    // ═══════════════════════════════════════════════════════════
    //  🌐 NETWORKING
    // ═══════════════════════════════════════════════════════════
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'
    implementation 'com.google.code.gson:gson:2.10.1'

    // ═══════════════════════════════════════════════════════════
    //  🎨 IMAGES
    // ═══════════════════════════════════════════════════════════
    implementation 'com.github.bumptech.glide:glide:4.16.0'

    // ═══════════════════════════════════════════════════════════
    //  📊 CHARTS
    // ═══════════════════════════════════════════════════════════
    implementation 'com.github.PhilJay:MPAndroidChart:v3.1.0'

    // ═══════════════════════════════════════════════════════════
    //  ⚡ COROUTINES
    // ═══════════════════════════════════════════════════════════
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-play-services:1.7.3'

    // ═══════════════════════════════════════════════════════════
    //  📝 LOGGING
    // ═══════════════════════════════════════════════════════════
    implementation 'com.jakewharton.timber:timber:5.0.1'

    // ═══════════════════════════════════════════════════════════
    //  🔧 DESUGARING (لدعم java.time على Android 7)
    // ═══════════════════════════════════════════════════════════
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'

    // ═══════════════════════════════════════════════════════════
    //  🧪 TESTING (Debug Only)
    // ═══════════════════════════════════════════════════════════
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'

    // ═══════════════════════════════════════════════════════════
    //  🐛 DEBUG TOOLS
    // ═══════════════════════════════════════════════════════════
    debugImplementation 'com.squareup.leakcanary:leakcanary-android:2.13'
}
