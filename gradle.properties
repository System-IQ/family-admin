# ============================================================
#  Family Admin v3.0 — Gradle Properties
#  ULTRA Configuration (Tested & Stable)
# ============================================================

# ═══════════════════════════════════════════════════════════
#  🎯 JVM Configuration
# ═══════════════════════════════════════════════════════════
# الذاكرة المخصصة للبناء (4 GB - كافية لـ Chaquopy)
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# تفعيل Daemon (أسرع بـ 30%)
org.gradle.daemon=true

# تفعيل البناء المتوازي (أسرع بـ 40%)
org.gradle.parallel=true

# تفعيل التخزين المؤقت (أسرع بـ 50%)
org.gradle.caching=true

# تفعيل Configuration Cache (أسرع بـ 20%)
org.gradle.configuration-cache=true

# إلغاء Watch File System (يسبب مشاكل على Linux)
org.gradle.vfs.watch=false

# ═══════════════════════════════════════════════════════════
#  🎨 AndroidX Configuration
# ═══════════════════════════════════════════════════════════
android.useAndroidX=true
android.enableJetifier=false

# Non-Transitive R Class (أسرع)
android.nonTransitiveRClass=true

# Non-Final Res IDs (أسرع)
android.nonFinalResIds=false

# ═══════════════════════════════════════════════════════════
#  🐍 Chaquopy Configuration
# ═══════════════════════════════════════════════════════════
# تفعيل Chaquopy
chaquopy.androidPythonVersion=3.11

# ═══════════════════════════════════════════════════════════
#  ⚙️ Kotlin Configuration
# ═══════════════════════════════════════════════════════════
kotlin.code.style=official
kotlin.incremental=true
kotlin.incremental.useClasspathSnapshot=true

# ═══════════════════════════════════════════════════════════
#  🔥 Firebase
# ═══════════════════════════════════════════════════════════
# منع تحذيرات Firebase
firebase.crashlytics.enabled=false

# ═══════════════════════════════════════════════════════════
#  🛡️ R8/ProGuard
# ═══════════════════════════════════════════════════════════
# تفعيل R8 الكامل (أسرع + أصغر)
android.enableR8.fullMode=true

# ═══════════════════════════════════════════════════════════
#  📦 Build Performance
# ═══════════════════════════════════════════════════════════
# تخطي اختبارات lint في debug (أسرع)
android.lint.checkTestSources=false

# زيادة عدد العمال
org.gradle.workers.max=4

# ═══════════════════════════════════════════════════════════
#  🎨 Resource Configuration
# ═══════════════════════════════════════════════════════════
# تفعيل PNG Crunching
android.enableResourceOptimizations=true

# ═══════════════════════════════════════════════════════════
#  🔧 Dependency Resolution
# ═══════════════════════════════════════════════════════════
# منع فشل البناء بسبب التنبيهات
android.suppressUnsupportedCompileSdk=34

# تجاهل تحذيرات AGP
android.uniquePackageNames=false
android.dependency.useConstraints=true
